<script>
/* ============================================================
   ۱) ابزارهای ساخت صدا
   ============================================================ */

function noiseBuffer(ctx, dur) {
  const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}

/* اسیلاتور + پاکت */
function tone(ctx, out, o = {}) {
  const t0 = o.t0 ?? 0;
  const dur = o.dur ?? 0.3;
  const peak = o.gain ?? 0.25;
  const atk = Math.min(o.atk ?? 0.005, dur * 0.4);
  const rel = Math.min(o.rel ?? 0.05, dur - atk);

  const osc = ctx.createOscillator();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(Math.max(1, o.freq ?? 440), t0);
  if (o.freqEnd != null) {
    osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.freqEnd), t0 + dur);
  }

  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak), t0 + atk);
  g.gain.setValueAtTime(Math.max(0.0001, peak), t0 + Math.max(atk, dur - rel));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

  osc.connect(g);
  let tail = g;
  if (o.filter) {
    const f = ctx.createBiquadFilter();
    f.type = o.filter;
    f.frequency.value = o.cutoff ?? 1200;
    f.Q.value = o.q ?? 0.7;
    g.connect(f);
    tail = f;
  }
  tail.connect(out);

  osc.start(t0);
  osc.stop(t0 + dur + 0.03);
  return osc;
}

/* نویز + فیلتر + پاکت */
function noise(ctx, out, o = {}) {
  const t0 = o.t0 ?? 0;
  const dur = o.dur ?? 0.3;
  const peak = o.gain ?? 0.25;
  const atk = Math.min(o.atk ?? 0.005, dur * 0.4);
  const rel = Math.min(o.rel ?? 0.05, dur - atk);

  const src = ctx.createBufferSource();
  src.buffer = noiseBuffer(ctx, dur + 0.06);

  let node = src, filter = null;
  if (o.filter) {
    filter = ctx.createBiquadFilter();
    filter.type = o.filter;
    filter.frequency.setValueAtTime(Math.max(1, o.freq ?? 1000), t0);
    if (o.freqEnd != null) {
      filter.frequency.exponentialRampToValueAtTime(Math.max(1, o.freqEnd), t0 + dur);
    }
    filter.Q.value = o.q ?? 0.7;
    src.connect(filter);
    node = filter;
  }

  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak), t0 + atk);
  g.gain.setValueAtTime(Math.max(0.0001, peak), t0 + Math.max(atk, dur - rel));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

  node.connect(g);
  g.connect(out);

  src.start(t0);
  src.stop(t0 + dur + 0.03);
  return { src, filter, gain: g };
}

/* ============================================================
   ۳) رندر آفلاین + انکود WAV
   ============================================================ */

async function renderBuffer(sound) {
  const sr = 44100;
  const ctx = new OfflineAudioContext(1, Math.ceil(sr * (sound.dur + 0.2)), sr);

  const master = ctx.createGain();
  master.gain.value = 0.9;

  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -8;
  comp.knee.value = 12;
  comp.ratio.value = 8;
  comp.attack.value = 0.003;
  comp.release.value = 0.2;

  master.connect(comp);
  comp.connect(ctx.destination);

  sound.build(ctx, master);
  return await ctx.startRendering();
}

function bufferToWav(buffer) {
  const numCh = buffer.numberOfChannels;
  const len = buffer.length;
  const sr = buffer.sampleRate;
  const dataSize = len * numCh * 2;
  const ab = new ArrayBuffer(44 + dataSize);
  const dv = new DataView(ab);
  let p = 0;

  const ws = s => { for (let i = 0; i < s.length; i++) dv.setUint8(p++, s.charCodeAt(i)); };
  const w32 = v => { dv.setUint32(p, v, true); p += 4; };
  const w16 = v => { dv.setUint16(p, v, true); p += 2; };

  ws('RIFF'); w32(36 + dataSize); ws('WAVE');
  ws('fmt '); w32(16); w16(1); w16(numCh); w32(sr);
  w32(sr * numCh * 2); w16(numCh * 2); w16(16);
  ws('data'); w32(dataSize);

  const chans = [];
  for (let c = 0; c < numCh; c++) chans.push(buffer.getChannelData(c));

  for (let i = 0; i < len; i++) {
    for (let c = 0; c < numCh; c++) {
      let s = Math.max(-1, Math.min(1, chans[c][i]));
      dv.setInt16(p, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      p += 2;
    }
  }
  return new Blob([ab], { type: 'audio/wav' });
}

/* ============================================================
   ۴) موتور پخش و دانلود
   ============================================================ */

const buffers = new Map();   // id -> Promise<AudioBuffer>
let liveCtx = null, masterGain = null;
let currentSrc = null, currentId = null;

function ac() {
  if (!liveCtx) {
    liveCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = liveCtx.createGain();
    masterGain.gain.value = 0.8;
    masterGain.connect(liveCtx.destination);
  }
  if (liveCtx.state === 'suspended') liveCtx.resume();
  return liveCtx;
}

function getBuffer(sound) {
  if (!buffers.has(sound.id)) {
    const p = renderBuffer(sound).catch(err => { buffers.delete(sound.id); throw err; });
    buffers.set(sound.id, p);
  }
  return buffers.get(sound.id);
}

function stopCurrent() {
  if (currentSrc) {
    try { currentSrc.onended = null; currentSrc.stop(); } catch (e) {}
    currentSrc = null;
  }
  currentId = null;
  updatePlayingUI();
}

async function playSound(sound) {
  const ctx = ac();
  if (currentId === sound.id) { stopCurrent(); return; }

  stopCurrent();

  const card = document.querySelector(`.card[data-id="${sound.id}"]`);
  const btn = card ? card.querySelector('.play') : null;
  if (btn && !buffers.has(sound.id)) btn.textContent = '⏳ ...';

  try {
    const buf = await getBuffer(sound);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(masterGain);
    src.start();
    currentSrc = src;
    currentId = sound.id;
    src.onended = () => {
      if (currentSrc === src) { currentSrc = null; currentId = null; updatePlayingUI(); }
    };
    updatePlayingUI();
  } catch (e) {
    console.error(e);
  } finally {
    if (btn) btn.textContent = '▶ پخش';
  }
}

function updatePlayingUI() {
  document.querySelectorAll('.card').forEach(card => {
    const on = card.dataset.id === currentId;
    card.classList.toggle('playing', on);
    const b = card.querySelector('.play');
    if (b) b.textContent = on ? '⏸ توقف' : '▶ پخش';
  });
}

function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 15000);
}

async function downloadSound(sound, btn) {
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = '⏳';
  try {
    const buf = await getBuffer(sound);
    triggerDownload(bufferToWav(buf), sound.id + '.wav');
    btn.textContent = '✅';
  } catch (e) {
    console.error(e);
    btn.textContent = '✕';
  }
  setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 850);
}

/* ============================================================
   ۵) رابط کاربری
   ============================================================ */

const grid = document.getElementById('grid');
const searchInput = document.getElementById('search');
const catSelect = document.getElementById('cat');
const volSlider = document.getElementById('vol');

function makeCard(s) {
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.id = s.id;
  el.innerHTML = `
    <span class="icon">${s.icon}</span>
    <div class="name">${s.name}</div>
    <div class="cat">${s.cat}</div>
    <div class="actions">
      <button class="btn play">▶ پخش</button>
      <button class="btn dl" title="دانلود WAV">⬇</button>
    </div>`;
  el.querySelector('.play').addEventListener('click', () => playSound(s));
  el.querySelector('.dl').addEventListener('click', e => downloadSound(s, e.currentTarget));
  return el;
}

function render() {
  const q = searchInput.value.trim().toLowerCase();
  const cat = catSelect.value;

  const list = SOUNDS.filter(s =>
    (cat === 'all' || s.cat === cat) &&
    (!q || s.name.toLowerCase().includes(q) || s.id.includes(q) || s.cat.includes(q))
  );

  grid.innerHTML = '';
  if (!list.length) {
    grid.innerHTML = '<div class="empty">چیزی پیدا نشد 🤷‍♂️</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  list.forEach(s => frag.appendChild(makeCard(s)));
  grid.appendChild(frag);
  updatePlayingUI();
}

searchInput.addEventListener('input', render);
catSelect.addEventListener('change', render);

volSlider.addEventListener('input', () => {
  const v = volSlider.value / 100;
  if (masterGain) masterGain.gain.value = v;
});

document.getElementById('stopBtn').addEventListener('click', stopCurrent);

document.getElementById('dlAll').addEventListener('click', async function () {
  const btn = this;
  btn.disabled = true;
  const total = SOUNDS.length;
  for (let i = 0; i < total; i++) {
    btn.textContent = `⏳ ${i + 1}/${total}`;
    try {
      const buf = await getBuffer(SOUNDS[i]);
      triggerDownload(bufferToWav(buf), SOUNDS[i].id + '.wav');
      await new Promise(r => setTimeout(r, 280));
    } catch (e) { console.error(e); }
  }
  btn.textContent = '✅ تمام شد';
  setTimeout(() => { btn.textContent = '⬇ دانلود همه'; btn.disabled = false; }, 2500);
});

/* شمارنده فارسی */
(function () {
  const fa = '۰۱۲۳۴۵۶۷۸۹';
  document.getElementById('count').textContent =
    String(SOUNDS.length).replace(/\d/g, d => fa[+d]);
})();

render();
</script>
